<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile — Nigeria Flavors</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#f8f5ee" />
  <link rel="stylesheet" href="styles.css" />
  <script src="pwa.js" defer></script>
  <script src="auth.js"></script>
  <script>
    // Early auth check - redirect to login if not authenticated
    (function() {
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
      }
    })();
  </script>
</head>
<body class="profile-page">
  <header class="profile-header">
    <a class="profile-brand" href="index.html" aria-label="Nigeria Flavors home">
      <img src="./favicon.png" alt="" />
      <span>Nigeria <strong>Flavors</strong></span>
    </a>
    <a class="profile-back-link" href="index.html">Back to the restaurant <span aria-hidden="true">↗</span></a>
  </header>

  <main class="profile-container">
    <div class="profile-page-intro">
      <p class="eyebrow">Your place at our table</p>
      <h1>Your profile</h1>
      <p>Keep your details close and make your next visit feel like coming home.</p>
    </div>

    <div class="profile-card">
      <img id="profileAvatar" src="assets/images/default-avatar.svg" alt="Profile Avatar" class="profile-avatar-large">

      <div class="profile-name">
        <h2 id="profileFullName">Loading...</h2>
        <p>Your Nigeria Flavors account</p>
      </div>

      <div class="profile-field">
        <label>Username</label>
        <span id="profileUsername">-</span>
      </div>

      <div class="profile-field">
        <label>Email</label>
        <span id="profileEmail">-</span>
      </div>

      <div class="profile-field">
        <label>Phone Number</label>
        <span id="profilePhone">-</span>
      </div>

      <div class="profile-field">
        <label>Last Login</label>
        <span id="profileLoginDate">-</span>
      </div>

      <div class="profile-actions">
        <label for="avatarUpload" class="btn">Upload Avatar</label>
        <input type="file" id="avatarUpload" accept="image/*">
        <a href="index.html" class="btn">Back to Home</a>
        <button onclick="logout()" class="btn" type="button">Logout</button>
      </div>
    </div>
  </main>

  <script src="app-config.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      
      const user = getCurrentUser();
      if (user && user.id) {
        loadProfile(user);
      } else {
        document.body.innerHTML = '<div style="text-align:center;padding:2rem;"><h2>Please log in to view profile</h2><a href="login.html" class="btn">Go to Login</a></div>';
      }
    });

    function loadProfile(user) {
      document.getElementById('profileAvatar').src = getProfileImageUrl(user.image);

  document.getElementById('profileFullName').textContent = user.username || '-';
  document.getElementById('profileUsername').textContent = user.username || '-';
  document.getElementById('profileEmail').textContent = user.email || '-';
  document.getElementById('profilePhone').textContent = user.phone || '-';

      

      const loginDate = user.loginDate ? new Date(user.loginDate).toLocaleString('en-US', { 
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
      }) : '-';
      document.getElementById('profileLoginDate').textContent = loginDate;
    }

    // Avatar upload handler
    document.getElementById('avatarUpload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('image/')) {
        alert('Please select a valid image file');
        return;
      }

      if (file.size > 5 * 1024 * 1024) { // 5MB
        alert('File too large. Max 5MB');
        return;
      }

      const user = getCurrentUser() || {};
      const token = authStorage.get('authToken');
      const API_URL = window.APP_API_BASE || (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:5000/api'
        : '/api');

      const readFileAsDataUrl = () => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read image file'));
        reader.readAsDataURL(file);
      });

      try {
        const formData = new FormData();
        formData.append('id', user.id || '');
        formData.append('avatar', file);

        const response = await fetch(`${API_URL}/auth/profile-upload`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        let data = {};
        const text = await response.text();
        if (text) {
          try {
            data = JSON.parse(text);
          } catch (parseError) {
            console.warn('Profile upload returned non-JSON response:', text);
          }
        }

        const previewImage = await readFileAsDataUrl();

        if (response.ok && data.user) {
          user.image = data.user.image || data.imageUrl || previewImage;
          authStorage.set('user', JSON.stringify(user));
          loadProfile(user);
          showSuccess('Avatar uploaded successfully!');
        } else {
          user.image = previewImage;
          authStorage.set('user', JSON.stringify(user));
          loadProfile(user);
          showSuccess('Avatar saved locally. Your profile image is ready to use.');
        }

        e.target.value = '';
      } catch (error) {
        const previewImage = await readFileAsDataUrl();
        user.image = previewImage;
        authStorage.set('user', JSON.stringify(user));
        loadProfile(user);
        showSuccess('Avatar saved locally. Your profile image is ready to use.');
        console.error('Upload error:', error);
      }
    });
  </script>



</body>
</html>
