<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile — Nigeria Flavours</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#f8f5ee" />
  <link rel="stylesheet" href="styles.css" />
  <script src="pwa.js" defer></script>
  <script src="auth.js"></script>
  <script>
    // Early auth check - redirect to login if not authenticated
    (function() {
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
      }
    })();
  </script>
</head>
<body class="profile-page">
  <header class="profile-header">
    <a class="profile-brand" href="index.html" aria-label="Nigeria Flavours home">
      <img src="./favicon.png" alt="" />
      <span>Nigeria <strong>Flavours</strong></span>
    </a>
    <a class="profile-back-link" href="index.html">Back to the restaurant <span aria-hidden="true">↗</span></a>
  </header>

  <main class="profile-container">
    <div class="profile-page-intro">
      <p class="eyebrow">Your place at our table</p>
      <h1>Your profile</h1>
      <p>Keep your details close and make your next visit feel like coming home.</p>
    </div>

    <div class="profile-card">
      <img id="profileAvatar" src="assets/images/default-avatar.svg" alt="Profile Avatar" class="profile-avatar-large" onerror="this.onerror=null;this.src='assets/images/default-avatar.svg'">

      <div class="profile-name">
        <h2 id="profileFullName">Loading...</h2>
        <p>Your Nigeria Flavours account</p>
      </div>

      <div class="profile-field">
        <label>Username</label>
        <span id="profileUsername">-</span>
      </div>

      <div class="profile-field">
        <label>Email</label>
        <span id="profileEmail">-</span>
      </div>

      <div class="profile-field">
        <label>Phone Number</label>
        <span id="profilePhone">-</span>
      </div>

      <div class="profile-field">
        <label>Last Login</label>
        <span id="profileLoginDate">-</span>
      </div>

      <p id="profileStatus" class="profile-status" role="status" aria-live="polite"></p>

      <div class="profile-actions">
        <label for="avatarUpload" class="btn">Upload Avatar</label>
        <input type="file" id="avatarUpload" accept="image/*">
        <a href="index.html" class="btn">Back to Home</a>
        <button onclick="logout()" class="btn" type="button">Logout</button>
      </div>
    </div>
  </main>

  <script src="app-config.js"></script>
  <script src="script.js"></script>
  <script>
    function setStatus(message, isError) {
      const el = document.getElementById('profileStatus');
      el.textContent = message || '';
      el.classList.toggle('is-error', !!isError);
    }

    function forceLogin() {
      authStorage.remove('authToken');
      authStorage.remove('user');
      window.location.href = 'login.html';
    }

    function loadProfile(user) {
      document.getElementById('profileAvatar').src = getProfileImageUrl(user.image);

      const fullName = [user.firstName, user.surname].filter(Boolean).join(' ');
      document.getElementById('profileFullName').textContent = fullName || user.username || '-';
      document.getElementById('profileUsername').textContent = user.username || '-';
      document.getElementById('profileEmail').textContent = user.email || '-';
      document.getElementById('profilePhone').textContent = user.phone || '-';

      const loginDate = user.loginDate ? new Date(user.loginDate).toLocaleString('en-US', {
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      }) : '-';
      document.getElementById('profileLoginDate').textContent = loginDate;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      checkAuth();

      const cached = getCurrentUser();
      if (!cached || !cached.id) {
        document.body.innerHTML = '<div style="text-align:center;padding:2rem;"><h2>Please log in to view profile</h2><a href="login.html" class="btn">Go to Login</a></div>';
        return;
      }
      loadProfile(cached);

      // Refresh from the server; an expired or invalid session sends the user back to login.
      try {
        const data = await apiRequest('/auth/me', { headers: { Authorization: 'Bearer ' + getAuthToken() } });
        authStorage.set('user', JSON.stringify(data.user));
        loadProfile(data.user);
      } catch (error) {
        if (error.status === 401) forceLogin();
      }
    });

    // Avatar upload
    document.getElementById('avatarUpload').addEventListener('change', async (e) => {
      const input = e.target;
      const file = input.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/') || file.type === 'image/svg+xml') {
        setStatus('Please choose a JPG, PNG, WebP, GIF or AVIF image.', true);
        input.value = '';
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        setStatus('That file is too large. The maximum is 5MB.', true);
        input.value = '';
        return;
      }

      setStatus('Uploading…', false);
      try {
        const formData = new FormData();
        formData.append('avatar', file); // the server takes the user id from the session token

        const data = await apiRequest('/auth/profile-upload', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + getAuthToken() },
          body: formData
        });

        const user = data && (data.user || (data.id ? data : null));
        if (!user) throw new Error('Upload finished but the server returned no profile data');
        authStorage.set('user', JSON.stringify(user));
        loadProfile(user);
        if (typeof updateProfileNav === 'function') updateProfileNav(user);
        setStatus('Profile photo updated.', false);
      } catch (error) {
        if (error.status === 401) return forceLogin();
        setStatus(error.message || 'Upload failed. Please try again.', true);
      } finally {
        input.value = '';
      }
    });

    // TEMPORARY DEBUG - delete this block after you send me the result
    window.addEventListener('load', async () => {
      const t = sessionStorage.getItem('authToken') || localStorage.getItem('authToken');
      const el = document.getElementById('profileStatus');
      try {
        const r = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + t } });
        el.textContent = 'DEBUG /auth/me: ' + r.status + ' ' + (await r.text()).slice(0, 300);
      } catch (e) {
        el.textContent = 'DEBUG failed: ' + e.message;
      }
    });
  </script>
</body>
</html>
