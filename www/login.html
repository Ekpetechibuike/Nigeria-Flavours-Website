<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In — Nigeria Flavors</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#d96c29" />
  <link rel="stylesheet" href="styles.css" />
  <script src="pwa.js" defer></script>
  <script src="auth.js"></script>
  <script>
    // Early auth check - redirect to home if already authenticated
    (function() {
      if (isAuthenticated()) {
        window.location.href = 'index.html';
      }
    })();
  </script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: 1rem;
    }
    .auth-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.1);
      text-align: center;
    }
    .auth-card h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.75rem;
      color: var(--accent);
    }
    .auth-card p {
      margin: 0 0 2rem 0;
      color: var(--muted);
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }
    .form-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
    }
    .form-group input {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,90,23,.1);
    }
    .auth-card .btn {
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
    }
    .auth-links {
      margin-top: 1.5rem;
      text-align: center;
    }
    .auth-links p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .auth-links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-links a:hover {
      text-decoration: underline;
    }
    .error-message {
      color: #dc2626;
      background: #fee2e2;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 1rem;
    }
    .success-message {
      color: #059669;
      background: #d1fae5;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
      margin-bottom: 1rem;
    }
    .logo-link {
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .logo-link img, .logo-link span {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      
      
      <h1>Sign In</h1>
      <p>Welcome back</p>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
<input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>

      <div class="auth-links">
        <p>Don't have an account? <a href="register.html">Create one</a></p>
      </div>
    </div>
  </div>

<script src="auth.js"></script>
  <script src="auth-handlers.js"></script>
  <script src="app-config.js"></script>
  <script src="script.js"></script>
