<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile — Nigeria Flavors</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#d96c29" />
  <link rel="stylesheet" href="styles.css" />
  <script src="pwa.js" defer></script>
  <script src="auth.js"></script>
  <script>
    // Early auth check - redirect to login if not authenticated
    (function() {
      if (!isAuthenticated()) {
        window.location.href = 'login.html';
      }
    })();
  </script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .profile-container { width: 100%; max-width: 500px; }
    .profile-card { background: var(--card-bg); border-radius: 12px; padding: 2.5rem; box-shadow: 0 20px 60px rgba(0,0,0,.1); }
    .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 1.5rem; border: 4px solid var(--accent); }
    .profile-field { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
    .profile-field label { font-weight: 500; font-size: 0.95rem; color: var(--text); }
    .profile-field span { padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    .profile-name { text-align: center; margin: 1rem 0; }
    .profile-name h1 { font-size: 1.75rem; color: var(--accent); margin: 0 0 0.5rem; }
    .profile-actions { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }

    .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
    label.btn { cursor: pointer; }

    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: var(--muted); color: white; }
    @media (max-width: 600px) { .profile-actions { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="profile-container">
    <div class="profile-card">
      <img id="profileAvatar" src="assets/images/default-avatar.jpg" alt="Profile Avatar" class="profile-avatar-large">
      
      <div class="profile-name">
        <h1 id="profileFullName">Loading...</h1>
      </div>
      
      <div class="profile-field">
        <label>Username</label>
        <span id="profileUsername">-</span>
      </div>
      
      <div class="profile-field">
        <label>Email</label>
        <span id="profileEmail">-</span>
      </div>
      



      
      <div class="profile-field">
        <label>Phone Number</label>
        <span id="profilePhone">-</span>
      </div>
      
      <div class="profile-field">
        <label>Last Login</label>
        <span id="profileLoginDate">-</span>
      </div>
      

      <div class="profile-actions">
        <label for="avatarUpload" class="btn btn-primary">Upload Avatar</label>
        <input type="file" id="avatarUpload" accept="image/*" style="display:none;">
        <a href="index.html" class="btn btn-primary">Back to Home</a>
        <button onclick="logout()" class="btn btn-secondary">Logout</button>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>
  <script src="app-config.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (user && user.id) {
        loadProfile(user);
      } else {
        document.body.innerHTML = '<div style="text-align:center;padding:2rem;"><h2>Please log in to view profile</h2><a href="login.html" class="btn">Go to Login</a></div>';
      }
    });

    function loadProfile(user) {
      document.getElementById('profileAvatar').src = user.image || 'assets/images/default-avatar.jpg';

  document.getElementById('profileFullName').textContent = user.username || '-';
  document.getElementById('profileUsername').textContent = user.username || '-';
  document.getElementById('profileEmail').textContent = user.email || '-';
  document.getElementById('profilePhone').textContent = user.phone || '-';

      

      const loginDate = user.loginDate ? new Date(user.loginDate).toLocaleString('en-US', { 
        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
      }) : '-';
      document.getElementById('profileLoginDate').textContent = loginDate;
    }

    // Avatar upload handler
    document.getElementById('avatarUpload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !file.type.startsWith('image/')) {
        alert('Please select a valid image file');
        return;
      }

      if (file.size > 5 * 1024 * 1024) { // 5MB
        alert('File too large. Max 5MB');
        return;
      }

      const user = JSON.parse(localStorage.getItem('user') || '{}');
      const token = localStorage.getItem('authToken');
      const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:5000/api'
        : '/api';

      const readFileAsDataUrl = () => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read image file'));
        reader.readAsDataURL(file);
      });

      try {
        const formData = new FormData();
        formData.append('avatar', file);
        formData.append('id', user.id || '');

        const response = await fetch(`${API_URL}/auth/profile-upload`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        let data = {};
        const text = await response.text();
        if (text) {
          try {
            data = JSON.parse(text);
          } catch (parseError) {
            console.warn('Profile upload returned non-JSON response:', text);
          }
        }

        const previewImage = await readFileAsDataUrl();

        if (response.ok && data.user) {
          user.image = data.user.image || data.imageUrl || previewImage;
          localStorage.setItem('user', JSON.stringify(user));
          loadProfile(user);
          showSuccess('Avatar uploaded successfully!');
        } else {
          user.image = previewImage;
          localStorage.setItem('user', JSON.stringify(user));
          loadProfile(user);
          showSuccess('Avatar saved locally. Your profile image is ready to use.');
        }

        e.target.value = '';
      } catch (error) {
        const previewImage = await readFileAsDataUrl();
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        user.image = previewImage;
        localStorage.setItem('user', JSON.stringify(user));
        loadProfile(user);
        showSuccess('Avatar saved locally. Your profile image is ready to use.');
        console.error('Upload error:', error);
      }
    });
  </script>



</body>
</html>
